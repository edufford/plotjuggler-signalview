name: CI (Linux)

on:
  push:
    branches: [dev_ai, main]
  pull_request:
    branches: [dev_ai, main]

# Required by dorny/test-reporter to publish test results
permissions:
  checks: write
  contents: read

jobs:
  test-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest

    env:
      PJ_INSTALL_DIR: ${{ github.workspace }}/plotjuggler-install
      PJ_VERSION: 3.16.0

    steps:
      - uses: actions/checkout@v4

      # xvfb provides a virtual framebuffer for headless Qt widget tests
      - name: Install plugin dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev cmake xvfb

      - name: Cache PlotJuggler
        id: cache-pj
        uses: actions/cache@v4
        with:
          path: ${{ env.PJ_INSTALL_DIR }}
          key: plotjuggler-${{ runner.os }}-${{ env.PJ_VERSION }}-${{ hashFiles('.github/workflows/ci-linux.yml') }}

      - name: Install PlotJuggler build dependencies
        if: steps.cache-pj.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y \
            libqt5svg5-dev libqt5opengl5-dev libqt5websockets5-dev \
            libqt5x11extras5-dev libcurl4-openssl-dev

      - name: Build PlotJuggler
        if: steps.cache-pj.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch $PJ_VERSION https://github.com/facontidavide/PlotJuggler.git /tmp/PlotJuggler
          cd /tmp/PlotJuggler
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=$PJ_INSTALL_DIR \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          make install

      # xvfb-run launches tests inside a virtual X display so Qt can
      # instantiate widgets without a physical screen.
      - name: Build and run tests
        run: xvfb-run env JUNIT_OUTPUT=${{ github.workspace }}/test-results.xml ./test.sh

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Report (Linux)
          path: ${{ github.workspace }}/test-results.xml
          reporter: java-junit
